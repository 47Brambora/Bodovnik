<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Správa tábora - Body</title>
    <!-- Příprava na přechod na TailwindCSS -->
    <!--<link rel="stylesheet" href="lib/tailwind.min.css">-->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Welcome page -->
    <div id="welcome-msg">
        <h1 id="welc-msg-title">BODOVNÍK</h1>
	    <button id="btn-edit-mem">Úprava členů</button>
    </div>

    <!-- Edit members page -->
    <div class="hidden" id="edit-members">
        <h1 style="text-align: center;">Úprava členů</h1>
        <div class="edit-members-navigation">
            <button id="to-welcome-page">Hlavní menu</button>
            <button id="btn-add-member">Přidat člena</button>
           <!-- <button id="btn-remove-member">Odebrat člena</button> -->
            <button id="btn-save-members">Uložit seznam členů</button>
            <br>
            Ukázat seznam členů<input type="checkbox" name="show-list-of-members" id="show-list-of-members">
        </div>
        <div class="add-member hidden" id="add-member">
            <h2>Přidat uživatele: </h2>
            jméno a přijmení: <input type="text"> <input type="text">   <!-- surname | lastname -->
            <br>
            klub: <input type="text">                                   <!-- club -->
            <br>
            skupina: <input type="text">                                <!-- group ( A / B / C / ... ) -->
            <br>
            tým: <input type="text">                                    <!-- team ( blue / green / yellow / black )-->
            <br>
            věk: <input type="number">                                  <!-- birth date -->
            <div class="nav"><button>Uložit</button><button id="btn-hide-add-member">schovat</button></div>
        </div>
        <div class="member-table hidden">
            <!-- TODO -->
        </div>
    </div>
    <script type="module" src="js/ui.js"></script>
</body>
</html>
